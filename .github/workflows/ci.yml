name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU-only torch keeps the install small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q src eval scripts app tests

      - name: Tests (offline, fake LLM and embeddings, no API key)
        env:
          LLM_PROVIDER: groq
          HF_HUB_OFFLINE: "1"
        run: pytest -q

      - name: Evaluation report renders
        run: |
          python - <<'PY'
          import json, tempfile, pathlib
          from eval.analysis import write_report
          d = pathlib.Path(tempfile.mkdtemp())
          rows = [{"pair": p, "variant": v, "repeat": 0, "faithfulness": f, "ats": .6,
                   "quality": .8, "overall": .7, "passed": f > .9, "iterations": 1, "history": []}
                  for p in "ab" for v, f in (("single_pass", .7), ("full", .95))]
          (d / "r.jsonl").write_text("".join(json.dumps(r) + "\n" for r in rows))
          write_report(d / "r.jsonl", d)
          assert (d / "results.png").exists()
          PY
